<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gothic+A1:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1f2326; } a:hover { color: #5a6166; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #eceef0; color: #1f2326; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; font-weight: 300; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- 검은 띠: 상중(喪中) -->
  <div style="flex-shrink: 0; height: 6px; background: #1f2326;"></div>

  <!-- 헤더 -->
  <div style="flex-shrink: 0; padding: 18px 24px 12px; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #c5cacd;">
    <span style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 17px;">우리 반 게시판</span>
    <span style="font-size: 10.5px; letter-spacing: 0.2em; color: #5a6166;">남은 날 2</span>
  </div>

  <!-- 원글: 빈 의자 -->
  <div style="flex-shrink: 0; padding: 16px 24px 14px; border-bottom: 1px solid #c5cacd; display: flex; gap: 14px; align-items: flex-start;">
    <svg width="34" height="44" viewBox="0 0 34 44" fill="none" stroke="#1f2326" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M6 2v20"></path><path d="M28 2v20"></path><path d="M6 8h22"></path><path d="M6 14h22"></path><path d="M3 22h28"></path><path d="M5 22v20"></path><path d="M29 22v20"></path><path d="M11 22v20"></path><path d="M23 22v20"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
      <span style="font-size: 10px; letter-spacing: 0.22em; color: #5a6166;">DAY 3 · 균열 · 공지</span>
      <p style="margin: 2px 0 0; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 17px; line-height: 1.4;">오늘: A의 빈자리</p>
      <p style="margin: 0; font-size: 12px; color: #464c51; line-height: 1.7; text-wrap: pretty;">기존 관계가 흔들리기 시작한다. 숨겨왔던 말이나 행동이 일부 공개된다.</p>
      <div style="display: flex; gap: 14px; margin-top: 6px; font-size: 11px; color: #5a6166;"><span>댓글 4</span><span>공감 2</span></div>
    </div>
  </div>

  <!-- 댓글: 조용하게, 사이가 넓게 -->
  <div style="flex-grow: 1; padding: 8px 24px 6px; display: flex; flex-direction: column; overflow: hidden;">

    <div style="padding: 14px 0; border-bottom: 1px solid #d9dde0; display: flex; flex-direction: column; gap: 5px;">
      <div style="display: flex; gap: 8px; align-items: baseline;">
        <span style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 12.5px;">서연</span>
        <span style="font-size: 10.5px; color: #5a6166;">3분 전</span>
      </div>
      <span style="font-size: 13.5px; line-height: 1.8; color: #2b3034;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</span>
      <span style="font-size: 11px; color: #5a6166;">답글 · 공감 1</span>
    </div>

    <div style="padding: 14px 0; border-bottom: 1px solid #d9dde0; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; text-align: right;">
      <div style="display: flex; gap: 8px; align-items: baseline;">
        <span style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 12.5px;">나</span>
        <span style="font-size: 10.5px; color: #5a6166;">2분 전</span>
      </div>
      <span style="font-size: 13.5px; line-height: 1.8; color: #1f2326;">그만하자는 사람이 제일 수상한 거, 알지?</span>
      <span style="font-size: 11px; color: #5a6166;">답글 · 공감 0</span>
    </div>

    <!-- 공개 = 부고처럼 두 겹 테두리. 조용하고 무겁게 -->
    <div style="margin: 12px 0; padding: 4px; border: 1px solid #1f2326;">
      <div style="border: 1px solid #1f2326; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 10px; letter-spacing: 0.26em; color: #5a6166;">공개 · 숨겨온 사실</span>
          <span style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 12.5px;">도윤</span>
        </div>
        <p style="margin: 0; font-family: 'Gowun Batang', serif; font-size: 15px; line-height: 1.85; color: #1f2326; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
        <span style="font-size: 10.5px; color: #5a6166;">이 말은 남는다</span>
      </div>
    </div>

    <div style="padding: 14px 0; border-bottom: 1px solid #d9dde0; display: flex; flex-direction: column; gap: 5px;">
      <div style="display: flex; gap: 8px; align-items: baseline;">
        <span style="font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 12.5px;">하은</span>
        <span style="font-size: 10.5px; color: #5a6166;">방금</span>
      </div>
      <span style="font-size: 13.5px; line-height: 1.8; color: #2b3034;">…뭐라고?</span>
    </div>

  </div>

  <!-- 입력 -->
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 24px 12px; border-top: 1px solid #c5cacd;">
    <div style="height: 44px; padding: 0 12px; border: 1px solid #8f969b; display: flex; align-items: center; font-size: 11.5px; color: #2b3034;">행동</div>
    <div style="height: 44px; padding: 0 12px; background: #1f2326; color: #eceef0; display: flex; align-items: center; font-size: 11.5px;">공개</div>
    <div style="flex-grow: 1; height: 44px; border-bottom: 1px solid #8f969b; display: flex; align-items: center; font-size: 13px; color: #5a6166;">조용히 남긴다</div>
  </div>

  <!-- 탭 -->
  <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #c5cacd;">
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Batang', serif; font-size: 14px; color: #1f2326; border-top: 1px solid #1f2326; margin-top: -1px;">게시판</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Batang', serif; font-size: 14px; color: #5a6166;">아이들</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Batang', serif; font-size: 14px; color: #5a6166;">프로필</div>
  </div>

</div>
</x-dc>
</body>
</html>
