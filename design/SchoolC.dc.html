<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7a1f1a; } a:hover { color: #591511; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #e8e2d2; color: #211d16; font-family: 'Nanum Gothic Coding', monospace; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(115deg, transparent 0 3px, rgba(33,29,22,0.025) 3px 4px); pointer-events: none;"></div>

  <!-- 문서 헤더 -->
  <div style="padding: 20px 20px 12px; border-bottom: 2px solid #211d16; position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 9.5px; letter-spacing: 0.2em; color: #6b6250;">문서번호 GH-0309-14</span>
        <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 19px; letter-spacing: 0.02em;">유출 기록 · 제3일</span>
      </div>
      <div style="border: 2px solid #7a1f1a; color: #7a1f1a; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 11px; text-align: center; line-height: 1.2; transform: rotate(-8deg);">대외<br>비</div>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 10px; font-size: 9.5px; color: #6b6250;">
      <span>열람등급 : 3급</span>
      <span>사안 : A의 빈자리</span>
    </div>
  </div>

  <!-- 본문: 줄번호가 붙은 진술 -->
  <div style="flex-grow: 1; padding: 14px 20px 6px; display: flex; flex-direction: column; gap: 13px; overflow: hidden; position: relative;">

    <div style="display: flex; gap: 10px;">
      <span style="font-size: 10px; color: #75705f; width: 16px; flex-shrink: 0;">01</span>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 10px; letter-spacing: 0.08em; color: #6b6250;">서연</span>
        <span style="font-size: 12.5px; line-height: 1.6; color: #211d16;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <span style="font-size: 10px; color: #75705f; width: 16px; flex-shrink: 0;">02</span>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 10px; letter-spacing: 0.08em; color: #7a1f1a;">나</span>
        <span style="font-size: 12.5px; line-height: 1.6; color: #211d16;">그만하자는 사람이 제일 수상한 거, 알지?</span>
      </div>
    </div>

    <!-- 공개 = 먹칠이 찢겨 나간 자리 -->
    <div style="display: flex; gap: 10px;">
      <span style="font-size: 10px; color: #75705f; width: 16px; flex-shrink: 0;">03</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 10px; letter-spacing: 0.08em; color: #7a1f1a;">도윤</span>
          <span style="font-size: 9.5px; letter-spacing: 0.1em; color: #7a1f1a; border: 1px solid #7a1f1a; padding: 1px 6px;">기밀 해제</span>
        </div>
        <div style="position: relative; background: #211d16; padding: 10px 12px; clip-path: polygon(0 0, 100% 0, 100% 78%, 92% 100%, 60% 84%, 30% 100%, 0 82%);">
          <p style="margin: 0; font-family: 'Nanum Myeongjo', serif; font-size: 13.5px; line-height: 1.75; color: #e8e2d2; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 10px;">
      <span style="font-size: 10px; color: #75705f; width: 16px; flex-shrink: 0;">04</span>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 10px; letter-spacing: 0.08em; color: #6b6250;">하은</span>
        <span style="font-size: 12.5px; line-height: 1.6; color: #211d16;">…뭐라고?</span>
      </div>
    </div>

  </div>

  <!-- 기입란 -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 10px 20px 14px; border-top: 1px dashed #9b927c; position: relative;">
    <div style="height: 44px; padding: 0 12px; border: 1px solid #211d16; display: flex; align-items: center; font-size: 10.5px; letter-spacing: 0.06em;">행동</div>
    <div style="height: 44px; padding: 0 12px; border: 1px solid #7a1f1a; background: #7a1f1a; color: #e8e2d2; display: flex; align-items: center; font-size: 10.5px; letter-spacing: 0.06em;">공개</div>
    <div style="flex-grow: 1; height: 44px; border: 1px solid #9b927c; background: #dfd8c4; display: flex; align-items: center; padding: 0 11px; font-size: 12px; color: #5a5243;">기록을 남기시오</div>
  </div>

  <!-- 탭 -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid #211d16; background: #ded6c1; position: relative;">
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 12.5px; letter-spacing: 0.14em; background: #211d16; color: #e8e2d2;">기록</div>
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 12.5px; letter-spacing: 0.14em; color: #4a4438; border-right: 1px solid #b6ac93; border-left: 1px solid #b6ac93;">인적사항</div>
    <div style="height: 54px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 12.5px; letter-spacing: 0.14em; color: #4a4438;">신원조회</div>
  </div>

</div>
</x-dc>
</body>
</html>
