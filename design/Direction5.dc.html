<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Gothic+A1:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #e0a458; } a:hover { color: #b98341; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0b0d10; color: #d5d9de; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; font-weight: 300; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- 아래에서 올라오는 폰 불빛 -->
  <div style="position: absolute; inset: 0; background: radial-gradient(75% 45% at 50% 100%, rgba(224,164,88,0.13) 0%, rgba(11,13,16,0) 70%); pointer-events: none;"></div>

  <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 24px; font-size: 10.5px; letter-spacing: 0.2em; color: #6f7780; position: relative;">
    <span>DAY 3</span>
    <span style="width: 3px; height: 3px; border-radius: 50%; background: #6f7780;"></span>
    <span>균열</span>
  </div>

  <div style="padding: 12px 24px 18px; border-bottom: 1px solid #1d2229; display: flex; flex-direction: column; gap: 7px; position: relative;">
    <span style="font-family: 'Noto Serif KR', serif; font-weight: 600; font-size: 22px; color: #eef1f4;">균열</span>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.7; color: #8b939c; text-wrap: pretty;">기존 관계가 흔들리기 시작한다. 숨겨왔던 말이나 행동이 일부 공개된다.</p>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
      <span style="width: 18px; height: 1px; background: #e0a458;"></span>
      <span style="font-size: 11px; letter-spacing: 0.08em; color: #e0a458;">오늘: A의 빈자리</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 18px 24px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; overflow: hidden; position: relative;">

    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 84%;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; color: #8b939c;">서연</span>
      <div style="background: #12151a; border: 1px solid #1d2229; padding: 10px 13px; font-size: 13.5px; line-height: 1.65; color: #c5cbd2; text-wrap: pretty;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 84%; align-self: flex-end; align-items: flex-end;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; color: #8b939c;">나</span>
      <div style="background: #1a1f26; border: 1px solid #2a313a; padding: 10px 13px; font-size: 13.5px; line-height: 1.65; color: #eef1f4; text-wrap: pretty;">그만하자는 사람이 제일 수상한 거, 알지?</div>
    </div>

    <!-- 공개 = 어둠 속에 켜지는 빛 -->
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 15px 17px; border: 1px solid #e0a458; background: rgba(224,164,88,0.07); box-shadow: 0 0 28px rgba(224,164,88,0.16);">
      <span style="font-size: 9.5px; letter-spacing: 0.22em; color: #e0a458;">도윤 · 숨겨온 사실을 공개했다</span>
      <span style="font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 15px; line-height: 1.8; color: #f3ede2; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 84%;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; color: #8b939c;">하은</span>
      <div style="background: #12151a; border: 1px solid #1d2229; padding: 10px 13px; font-size: 13.5px; line-height: 1.65; color: #c5cbd2;">…뭐라고?</div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 10px 24px 14px; border-top: 1px solid #1d2229; position: relative;">
    <div style="height: 44px; padding: 0 12px; border: 1px solid #2a313a; display: flex; align-items: center; font-size: 11.5px; color: #c5cbd2;">행동</div>
    <div style="height: 44px; padding: 0 12px; border: 1px solid #e0a458; display: flex; align-items: center; font-size: 11.5px; color: #e0a458;">공개</div>
    <div style="flex-grow: 1; height: 44px; background: #12151a; border: 1px solid #1d2229; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #8b939c;">교실에 말하기</div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -13px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e0a458" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #1d2229; background: #0d1014; position: relative;">
    <div style="height: 58px; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 13.5px; color: #e0a458; border-top: 1px solid #e0a458; margin-top: -1px;">교실</div>
    <div style="height: 58px; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 13.5px; color: #8b939c;">아이들</div>
    <div style="height: 58px; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif KR', serif; font-weight: 500; font-size: 13.5px; color: #8b939c;">프로필</div>
  </div>

</div>
</x-dc>
</body>
</html>
