<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2563eb; } a:hover { color: #1d4ed8; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #ffffff; color: #191919; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- 커뮤니티 헤더 -->
  <div style="flex-shrink: 0; height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #ececec;">
    <span style="font-weight: 700; font-size: 15px;">우리반 게시판</span>
    <span style="font-size: 11px; color: #9a9a9a;">실시간</span>
    <span style="flex-grow: 1;"></span>
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5a5a5a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.3-4.3"></path></svg>
  </div>

  <!-- 원글: 오늘의 사건 -->
  <div style="flex-shrink: 0; padding: 12px 16px; border-bottom: 6px solid #f5f5f5;">
    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
      <span style="font-size: 10px; padding: 2px 7px; background: #f0f0f0; color: #6b6b6b; border-radius: 3px;">공지</span>
      <span style="font-size: 10.5px; color: #9a9a9a;">DAY 3 · 균열</span>
    </div>
    <p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.5;">오늘: A의 빈자리</p>
    <p style="margin: 4px 0 0; font-size: 12px; color: #6b6b6b; line-height: 1.55;">기존 관계가 흔들리기 시작한다. 숨겨왔던 말이나 행동이 일부 공개된다.</p>
    <div style="display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #9a9a9a;">
      <span>댓글 4</span>
      <span>공감 2</span>
    </div>
  </div>

  <!-- 댓글 스레드 -->
  <div style="flex-grow: 1; padding: 6px 16px 8px; display: flex; flex-direction: column; overflow: hidden;">

    <div style="display: flex; gap: 9px; padding: 11px 0; border-bottom: 1px solid #f2f2f2;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #eef1f5; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #6b7280;">서</div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="display: flex; gap: 7px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 500;">서연</span>
          <span style="font-size: 10.5px; color: #b0b0b0;">3분 전</span>
        </div>
        <span style="font-size: 13.5px; line-height: 1.55; color: #262626;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</span>
        <span style="font-size: 11px; color: #9a9a9a; margin-top: 2px;">답글 · 공감 1</span>
      </div>
    </div>

    <div style="display: flex; gap: 9px; padding: 11px 0; border-bottom: 1px solid #f2f2f2;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #dbe9ff; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #2563eb; font-weight: 700;">나</div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="display: flex; gap: 7px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 500; color: #2563eb;">나</span>
          <span style="font-size: 10.5px; color: #b0b0b0;">2분 전</span>
        </div>
        <span style="font-size: 13.5px; line-height: 1.55; color: #262626;">그만하자는 사람이 제일 수상한 거, 알지?</span>
        <span style="font-size: 11px; color: #9a9a9a; margin-top: 2px;">답글 · 공감 0</span>
      </div>
    </div>

    <!-- 공개 = 하이라이트 댓글 -->
    <div style="margin: 8px 0; padding: 12px 13px; background: #fff7ed; border: 1px solid #fdba74; border-radius: 8px; display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span style="font-size: 10px; padding: 2px 8px; background: #ea580c; color: #ffffff; border-radius: 10px; font-weight: 700;">공개</span>
        <span style="font-size: 12px; font-weight: 500;">도윤</span>
        <span style="font-size: 10.5px; color: #c2884f;">방금</span>
      </div>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #262626; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
      <span style="font-size: 10.5px; color: #c2884f;">이 댓글은 지울 수 없습니다</span>
    </div>

    <div style="display: flex; gap: 9px; padding: 11px 0; border-bottom: 1px solid #f2f2f2;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #eef1f5; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #6b7280;">하</div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="display: flex; gap: 7px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 500;">하은</span>
          <span style="font-size: 10.5px; color: #b0b0b0;">방금</span>
        </div>
        <span style="font-size: 13.5px; line-height: 1.55; color: #262626;">…뭐라고?</span>
      </div>
    </div>

  </div>

  <!-- 댓글 입력 -->
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 9px 16px 11px; border-top: 1px solid #ececec;">
    <div style="height: 44px; padding: 0 12px; border: 1px solid #d9d9d9; border-radius: 22px; display: flex; align-items: center; font-size: 11.5px; color: #5a5a5a;">행동</div>
    <div style="height: 44px; padding: 0 12px; border-radius: 22px; background: #ea580c; display: flex; align-items: center; font-size: 11.5px; color: #ffffff; font-weight: 500;">공개</div>
    <div style="flex-grow: 1; height: 44px; background: #f5f5f5; border-radius: 22px; display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: #9a9a9a;">댓글을 입력하세요</div>
  </div>

  <!-- 탭 -->
  <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #ececec;">
    <div style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #191919;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H8l-4 3z"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">게시판</span>
    </div>
    <div style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #b0b0b0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.3"></circle><circle cx="17" cy="9" r="2.6"></circle><path d="M3 19c1-3.5 3.6-5 6-5s5 1.5 6 5"></path></svg>
      <span style="font-size: 10px;">아이들</span>
    </div>
    <div style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #b0b0b0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3.4"></circle><path d="M5.5 20c1.2-3.5 3.7-5 6.5-5s5.3 1.5 6.5 5"></path></svg>
      <span style="font-size: 10px;">프로필</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
