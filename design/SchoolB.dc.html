<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #56727f; } a:hover { color: #3d5568; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #e6e9ec; color: #1b2024; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- 커뮤니티 헤더 -->
  <div style="flex-shrink: 0; height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #dadfe3; border-bottom: 1px solid #c3cad0;">
    <span style="font-weight: 700; font-size: 15px;">우리반 게시판</span>
    <span style="font-size: 11px; color: #5c656c;">실시간</span>
    <span style="flex-grow: 1;"></span>
    <div style="width: 44px; height: 44px; margin-right: -12px; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#5c656c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.3-4.3"></path></svg></div>
  </div>

  <!-- 원글: 오늘의 사건 -->
  <div style="flex-shrink: 0; padding: 12px 16px; background: #dadfe3; border-bottom: 6px solid #cfd6db;">
    <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
      <span style="font-size: 10px; padding: 2px 7px; background: #c3cad0; color: #33393e; border-radius: 3px;">공지</span>
      <span style="font-size: 10.5px; color: #5c656c;">DAY 3 · 균열</span>
    </div>
    <p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.5;">오늘: A의 빈자리</p>
    <p style="margin: 4px 0 0; font-size: 12px; color: #4a5157; line-height: 1.55;">기존 관계가 흔들리기 시작한다. 숨겨왔던 말이나 행동이 일부 공개된다.</p>
    <div style="display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #5c656c;">
      <span>댓글 4</span>
      <span>공감 2</span>
    </div>
  </div>

  <!-- 댓글 스레드 -->
  <div style="flex-grow: 1; padding: 6px 16px 8px; display: flex; flex-direction: column; overflow: hidden;">

    <div style="display: flex; gap: 9px; padding: 11px 0; border-bottom: 1px solid #d3d9dd;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #cbd2d8; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #454c52;">서</div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="display: flex; gap: 7px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 500;">서연</span>
          <span style="font-size: 10.5px; color: #5c656c;">3분 전</span>
        </div>
        <span style="font-size: 13.5px; line-height: 1.55; color: #1f2428;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</span>
        <span style="font-size: 11px; color: #5c656c; margin-top: 2px;">답글 · 공감 1</span>
      </div>
    </div>

    <div style="display: flex; gap: 9px; padding: 11px 0; border-bottom: 1px solid #d3d9dd;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #3d5568; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #ffffff; font-weight: 700;">나</div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="display: flex; gap: 7px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 500; color: #3d5568;">나</span>
          <span style="font-size: 10.5px; color: #5c656c;">2분 전</span>
        </div>
        <span style="font-size: 13.5px; line-height: 1.55; color: #1f2428;">그만하자는 사람이 제일 수상한 거, 알지?</span>
        <span style="font-size: 11px; color: #5c656c; margin-top: 2px;">답글 · 공감 0</span>
      </div>
    </div>

    <!-- 공개 = 하이라이트 댓글. 밝고 따뜻한 강조 대신, 가라앉은 슬레이트 톤으로 무겁게 -->
    <div style="margin: 8px 0; padding: 12px 13px; background: #ccd4da; border: 1px solid #8b969e; border-radius: 4px; display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <span style="font-size: 10px; padding: 2px 8px; background: #29404f; color: #ffffff; border-radius: 3px; font-weight: 700;">공개</span>
        <span style="font-size: 12px; font-weight: 500;">도윤</span>
        <span style="font-size: 10.5px; color: #4c5c66;">방금</span>
      </div>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #1b2024; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
      <span style="font-size: 10.5px; color: #4c5c66;">이 댓글은 지울 수 없습니다</span>
    </div>

    <div style="display: flex; gap: 9px; padding: 11px 0; border-bottom: 1px solid #d3d9dd;">
      <div style="width: 26px; height: 26px; border-radius: 50%; background: #cbd2d8; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #454c52;">하</div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="display: flex; gap: 7px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 500;">하은</span>
          <span style="font-size: 10.5px; color: #5c656c;">방금</span>
        </div>
        <span style="font-size: 13.5px; line-height: 1.55; color: #1f2428;">…뭐라고?</span>
      </div>
    </div>

  </div>

  <!-- 댓글 입력 -->
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 9px 16px 11px; background: #dadfe3; border-top: 1px solid #c3cad0;">
    <div style="height: 44px; padding: 0 12px; border: 1px solid #a3adb4; border-radius: 8px; display: flex; align-items: center; font-size: 11.5px; color: #454c52;">행동</div>
    <div style="height: 44px; padding: 0 12px; border-radius: 8px; background: #29404f; display: flex; align-items: center; font-size: 11.5px; color: #ffffff; font-weight: 500;">공개</div>
    <div style="flex-grow: 1; height: 44px; background: #e6e9ec; border: 1px solid #c3cad0; border-radius: 8px; display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: #5c656c;">댓글을 입력하세요</div>
  </div>

  <!-- 탭 -->
  <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #dadfe3; border-top: 1px solid #c3cad0;">
    <div style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1b2024; border-top: 2px solid #3d5568; margin-top: -1px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v12H8l-4 3z"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">게시판</span>
    </div>
    <div style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5c656c;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.3"></circle><circle cx="17" cy="9" r="2.6"></circle><path d="M3 19c1-3.5 3.6-5 6-5s5 1.5 6 5"></path></svg>
      <span style="font-size: 10px;">아이들</span>
    </div>
    <div style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5c656c;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3.4"></circle><path d="M5.5 20c1.2-3.5 3.7-5 6.5-5s5.3 1.5 6.5 5"></path></svg>
      <span style="font-size: 10px;">프로필</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
