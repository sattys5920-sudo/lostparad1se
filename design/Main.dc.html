<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gothic+A1:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #a45a52; } a:hover { color: #83433c; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #c9ced0; color: #2c3639; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; font-weight: 300; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(238,241,241,0.7) 0%, rgba(201,206,208,0) 40%, rgba(150,158,162,0.3) 100%); pointer-events: none;"></div>

  <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 24px; font-size: 10.5px; letter-spacing: 0.2em; color: #5d686b; position: relative;">
    <span>DAY 3</span>
    <span style="width: 3px; height: 3px; border-radius: 50%; background: #5d686b;"></span>
    <span>균열</span>
  </div>

  <div style="padding: 14px 24px 18px; border-bottom: 1px solid #aab1b3; display: flex; flex-direction: column; gap: 6px; position: relative;">
    <span style="font-size: 10px; letter-spacing: 0.28em; color: #5d686b;">DAY 3</span>
    <h1 style="margin: 2px 0 4px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 21px; color: #2c3639;">균열</h1>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.7; color: #4c565a; text-wrap: pretty;">기존 관계가 흔들리기 시작한다. 숨겨왔던 말이나 행동이 일부 공개된다.</p>
    <span style="margin-top: 6px; align-self: flex-start; font-size: 11px; letter-spacing: 0.06em; color: #83433c; border: 1px solid #c98f89; padding: 4px 10px;">오늘: A의 빈자리</span>
  </div>

  <div style="flex-grow: 1; padding: 20px 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; overflow: hidden; position: relative;">

    <div style="display: flex; flex-direction: column; gap: 5px;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; color: #4c565a;">서연</span>
      <span style="font-size: 14px; line-height: 1.75; color: #414a4d; max-width: 85%; text-wrap: pretty;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-end; text-align: right;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; color: #4c565a;">나</span>
      <span style="font-size: 14px; line-height: 1.75; color: #2c3639; max-width: 85%; text-wrap: pretty;">그만하자는 사람이 제일 수상한 거, 알지?</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px; padding: 14px 16px; border: 1px solid #c98f89; background: rgba(164,90,82,0.06);">
      <span style="font-size: 9.5px; letter-spacing: 0.18em; color: #83433c;">도윤 · 숨겨온 사실을 공개했다</span>
      <span style="font-family: 'Gowun Batang', serif; font-size: 15px; line-height: 1.8; color: #2c3639; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 5px;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; color: #4c565a;">하은</span>
      <span style="font-size: 14px; line-height: 1.75; color: #414a4d; max-width: 85%;">…뭐라고?</span>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 24px 16px; border-top: 1px solid #aab1b3; position: relative;">
    <div style="height: 44px; padding: 0 12px; border: 1px solid #8f9799; display: flex; align-items: center; font-size: 11.5px; color: #414a4d;">행동</div>
    <div style="height: 44px; padding: 0 12px; border: 1px solid #83433c; display: flex; align-items: center; font-size: 11.5px; color: #83433c;">공개</div>
    <div style="flex-grow: 1; height: 40px; border-bottom: 1px solid #8f9799; display: flex; align-items: center; font-size: 13px; color: #4c565a;">교실에 말하기</div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -13px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2c3639" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #aab1b3; position: relative;">
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Batang', serif; font-size: 14px; color: #2c3639; border-top: 1px solid #2c3639; margin-top: -1px;">교실</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Batang', serif; font-size: 14px; color: #5d686b;">아이들</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Batang', serif; font-size: 14px; color: #5d686b;">프로필</div>
  </div>

</div>
</x-dc>
</body>
</html>
