<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gothic+A1:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0f1216; } a:hover { color: #4a5058; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f4f5f6; color: #0f1216; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; font-weight: 300; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background: radial-gradient(110% 70% at 50% 0%, rgba(255,255,255,0.95) 0%, rgba(244,245,246,0) 65%); pointer-events: none;"></div>

  <!-- 날짜: 숫자가 크다 -->
  <div style="padding: 34px 28px 18px; border-bottom: 1px solid #0f1216; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; position: relative;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 10px; letter-spacing: 0.34em; color: #6b7178;">셋째 날</span>
      <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 54px; line-height: 0.95; letter-spacing: -0.02em;">균열</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-bottom: 6px;">
      <span style="font-size: 10px; letter-spacing: 0.24em; color: #6b7178;">오늘</span>
      <span style="font-family: 'Nanum Myeongjo', serif; font-size: 13.5px; letter-spacing: 0.06em;">A의 빈자리</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 22px 28px 8px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; position: relative;">

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 12px; letter-spacing: 0.1em;">서연</span>
      <span style="font-size: 14px; line-height: 1.8; color: #2b3036; max-width: 88%; text-wrap: pretty;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척 하잖아.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end; text-align: right;">
      <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 12px; letter-spacing: 0.1em;">나</span>
      <span style="font-size: 14px; line-height: 1.8; color: #0f1216; max-width: 88%; text-wrap: pretty;">그만하자는 사람이 제일 수상한 거, 알지?</span>
    </div>

    <!-- 공개 = 검은 덩어리. 진실이 어두운 쪽이다 -->
    <div style="background: #0f1216; color: #f4f5f6; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 9.5px; letter-spacing: 0.28em; color: #a9afb6;">도윤 · 숨겨온 사실</span>
      <span style="font-family: 'Nanum Myeongjo', serif; font-size: 16px; line-height: 1.75; text-wrap: pretty;">A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 12px; letter-spacing: 0.1em;">하은</span>
      <span style="font-size: 14px; line-height: 1.8; color: #2b3036;">…뭐라고?</span>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 16px; padding: 12px 28px 16px; position: relative;">
    <span style="height: 40px; display: flex; align-items: center; font-size: 12px; letter-spacing: 0.12em; color: #0f1216; border-bottom: 1px solid #0f1216;">행동</span>
    <span style="height: 40px; display: flex; align-items: center; font-size: 12px; letter-spacing: 0.12em; color: #0f1216; border-bottom: 1px solid #0f1216;">공개</span>
    <div style="flex-grow: 1; height: 40px; border-bottom: 1px solid #c9ccd0; display: flex; align-items: center; font-size: 13px; color: #8b9198;">교실에 말하기</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f1216" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #0f1216; position: relative;">
    <div style="height: 58px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.16em; background: #0f1216; color: #f4f5f6;">교실</div>
    <div style="height: 58px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.16em; color: #4a5058; border-right: 1px solid #c9ccd0;">아이들</div>
    <div style="height: 58px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.16em; color: #4a5058;">프로필</div>
  </div>

</div>
</x-dc>
</body>
</html>
