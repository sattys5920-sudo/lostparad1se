<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gothic+A1:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #0b0d0f; } a:hover { color: #4d545a; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; color: #0b0d0f; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; font-weight: 300; display: flex; flex-direction: column; overflow: hidden; position: relative; background-color: #eef0f2; background-image: radial-gradient(circle at 12% 18%, #ffffff 0 1.6px, transparent 2.2px), radial-gradient(circle at 78% 9%, #ffffff 0 1.2px, transparent 1.8px), radial-gradient(circle at 46% 31%, #ffffff 0 1.4px, transparent 2px), radial-gradient(circle at 90% 44%, #ffffff 0 1.8px, transparent 2.4px), radial-gradient(circle at 22% 57%, #ffffff 0 1.2px, transparent 1.8px), radial-gradient(circle at 63% 66%, #ffffff 0 1.6px, transparent 2.2px), radial-gradient(circle at 8% 81%, #ffffff 0 1.4px, transparent 2px), radial-gradient(circle at 84% 88%, #ffffff 0 1.2px, transparent 1.8px), radial-gradient(circle at 38% 93%, #ffffff 0 1.8px, transparent 2.4px), radial-gradient(circle at 55% 12%, #ffffff 0 1px, transparent 1.6px), radial-gradient(circle at 30% 44%, #ffffff 0 1px, transparent 1.6px), radial-gradient(circle at 70% 52%, #ffffff 0 1.2px, transparent 1.8px);">

  <!-- 검은 띠 -->
  <div style="flex-shrink: 0; height: 8px; background: #0b0d0f;"></div>

  <div style="flex-shrink: 0; padding: 18px 24px 12px; display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #0b0d0f;">
    <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 18px;">우리 반 게시판</span>
    <span style="font-size: 10.5px; letter-spacing: 0.22em; color: #4d545a;">12월 · 남은 날 2</span>
  </div>

  <!-- 원글: 눈 쌓인 빈 의자 -->
  <div style="flex-shrink: 0; padding: 16px 24px 14px; border-bottom: 1px solid #0b0d0f; display: flex; gap: 14px; align-items: flex-start;">
    <svg width="34" height="44" viewBox="0 0 34 44" fill="none" stroke="#0b0d0f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;"><path d="M6 4v18"></path><path d="M28 4v18"></path><path d="M6 10h22"></path><path d="M6 16h22"></path><path d="M3 22h28"></path><path d="M5 22v20"></path><path d="M29 22v20"></path><path d="M11 22v20"></path><path d="M23 22v20"></path><path d="M3 22c3-3 6-3 8-1s6 2 9 0 6-2 11 1" stroke="#ffffff" stroke-width="3"></path><path d="M6 4c2-2 4-2 5 0M23 4c2-2 4-2 5 0" stroke="#ffffff" stroke-width="2.5"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
      <span style="font-size: 10px; letter-spacing: 0.24em; color: #4d545a;">DAY 3 · 균열 · 공지</span>
      <p style="margin: 2px 0 0; font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 18px; line-height: 1.4;">오늘: A의 빈자리</p>
      <p style="margin: 0; font-size: 12px; color: #2f353a; line-height: 1.7; text-wrap: pretty;">기존 관계가 흔들리기 시작한다. 숨겨왔던 말이나 행동이 일부 공개된다.</p>
      <div style="display: flex; gap: 14px; margin-top: 6px; font-size: 11px; color: #4d545a;"><span>댓글 4</span><span>공감 2</span></div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 8px 24px 6px; display: flex; flex-direction: column; overflow: hidden;">

    <div style="padding: 14px 0; border-bottom: 1px solid #c9ced2; display: flex; flex-direction: column; gap: 5px;">
      <div style="display: flex; gap: 8px; align-items: baseline;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 12.5px;">서연</span>
        <span style="font-size: 10.5px; color: #4d545a;">3분 전</span>
      </div>
      <span style="font-size: 13.5px; line-height: 1.8; color: #1a1e21;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</span>
      <span style="font-size: 11px; color: #4d545a;">답글 · 공감 1</span>
    </div>

    <div style="padding: 14px 0; border-bottom: 1px solid #c9ced2; display: flex; flex-direction: column; gap: 5px; align-items: flex-end; text-align: right;">
      <div style="display: flex; gap: 8px; align-items: baseline;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 12.5px;">나</span>
        <span style="font-size: 10.5px; color: #4d545a;">2분 전</span>
      </div>
      <span style="font-size: 13.5px; line-height: 1.8; color: #0b0d0f;">그만하자는 사람이 제일 수상한 거, 알지?</span>
      <span style="font-size: 11px; color: #4d545a;">답글 · 공감 0</span>
    </div>

    <!-- 공개 = 눈 위에 떨어진 검정. 흰 안쪽 선 하나 -->
    <div style="margin: 12px 0; padding: 4px; background: #0b0d0f;">
      <div style="border: 1px solid #eef0f2; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 7px; color: #f7f8f9;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 10px; letter-spacing: 0.26em; color: #c9ced2;">공개 · 숨겨온 사실</span>
          <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 12.5px;">도윤</span>
        </div>
        <p style="margin: 0; font-family: 'Nanum Myeongjo', serif; font-size: 15px; line-height: 1.85; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
        <span style="font-size: 10.5px; color: #c9ced2;">눈이 덮지 못한다</span>
      </div>
    </div>

    <div style="padding: 14px 0; border-bottom: 1px solid #c9ced2; display: flex; flex-direction: column; gap: 5px;">
      <div style="display: flex; gap: 8px; align-items: baseline;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 12.5px;">하은</span>
        <span style="font-size: 10.5px; color: #4d545a;">방금</span>
      </div>
      <span style="font-size: 13.5px; line-height: 1.8; color: #1a1e21;">…뭐라고?</span>
    </div>

  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 24px 12px; border-top: 1px solid #0b0d0f;">
    <div style="height: 44px; padding: 0 12px; border: 1px solid #0b0d0f; display: flex; align-items: center; font-size: 11.5px; color: #0b0d0f;">행동</div>
    <div style="height: 44px; padding: 0 12px; background: #0b0d0f; color: #f7f8f9; display: flex; align-items: center; font-size: 11.5px;">공개</div>
    <div style="flex-grow: 1; height: 44px; border-bottom: 1px solid #0b0d0f; display: flex; align-items: center; font-size: 13px; color: #4d545a;">조용히 남긴다</div>
  </div>

  <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #0b0d0f;">
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 14px; background: #0b0d0f; color: #f7f8f9;">게시판</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-size: 14px; color: #2f353a; border-right: 1px solid #c9ced2;">아이들</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-size: 14px; color: #2f353a;">프로필</div>
  </div>

</div>
</x-dc>
</body>
</html>
