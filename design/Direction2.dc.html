<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b8322a; } a:hover { color: #8a241e; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #efe9de; color: #1f1c18; font-family: 'Nanum Gothic Coding', 'Apple SD Gothic Neo', monospace; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(180deg, transparent 0 27px, rgba(31,28,24,0.05) 27px 28px); pointer-events: none;"></div>

  <!-- 문서 머리 -->
  <div style="padding: 24px 22px 12px; border-bottom: 2px solid #1f1c18; display: flex; flex-direction: column; gap: 8px; position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-size: 9.5px; letter-spacing: 0.22em; color: #6f6656;">진술 기록 · 제3일</span>
      <span style="font-size: 9.5px; letter-spacing: 0.1em; color: #6f6656;">No. 0314-03</span>
    </div>
    <div style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 24px; letter-spacing: 0.04em;">균열</div>
    <p style="margin: 0; font-family: 'Nanum Myeongjo', serif; font-size: 12.5px; line-height: 1.7; color: #4a443a; text-wrap: pretty;">기존 관계가 흔들리기 시작한다. 숨겨왔던 말이나 행동이 일부 공개된다.</p>
    <div style="display: flex; gap: 8px; align-items: center; font-size: 10.5px; color: #6f6656;">
      <span style="letter-spacing: 0.16em;">사 건</span>
      <span style="width: 1px; height: 10px; background: #b6ad9b;"></span>
      <span style="font-family: 'Nanum Myeongjo', serif; font-size: 12px; color: #1f1c18;">A의 빈자리</span>
    </div>
  </div>

  <!-- 대화는 녹취록처럼 -->
  <div style="flex-grow: 1; padding: 16px 22px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; overflow: hidden; position: relative;">

    <div style="display: flex; gap: 10px; align-items: baseline;">
      <span style="font-size: 10px; color: #6f6656; white-space: nowrap;">14:02</span>
      <span style="font-size: 13px; line-height: 1.7; color: #2b2721; text-wrap: pretty;"><strong style="font-family: 'Nanum Myeongjo', serif; font-weight: 700; margin-right: 6px;">서연</strong>A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</span>
    </div>

    <div style="display: flex; gap: 10px; align-items: baseline;">
      <span style="font-size: 10px; color: #6f6656; white-space: nowrap;">14:03</span>
      <span style="font-size: 13px; line-height: 1.7; color: #2b2721; text-wrap: pretty;"><strong style="font-family: 'Nanum Myeongjo', serif; font-weight: 700; margin-right: 6px; color: #b8322a;">나</strong>그만하자는 사람이 제일 수상한 거, 알지?</span>
    </div>

    <!-- 공개 = 진술서 -->
    <div style="margin: 6px 0; border: 1.5px solid #1f1c18; background: #f6f1e7; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; position: relative;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 13px; letter-spacing: 0.34em;">진 술 서</span>
        <span style="font-size: 9.5px; letter-spacing: 0.14em; color: #6f6656;">숨겨온 사실</span>
      </div>
      <p style="margin: 0; font-family: 'Nanum Myeongjo', serif; font-size: 14.5px; line-height: 1.85; color: #1f1c18; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px dotted #9b9280; padding-top: 8px;">
        <span style="font-size: 10.5px; color: #6f6656;">진술인 <strong style="font-family: 'Nanum Myeongjo', serif; color: #1f1c18; font-size: 12px; margin-left: 4px;">도윤</strong></span>
        <span style="font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 12px; letter-spacing: 0.12em; color: #b8322a; border: 2px solid #b8322a; padding: 4px 8px; transform: rotate(-7deg);">공개됨</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: baseline;">
      <span style="font-size: 10px; color: #6f6656; white-space: nowrap;">14:05</span>
      <span style="font-size: 13px; line-height: 1.7; color: #2b2721;"><strong style="font-family: 'Nanum Myeongjo', serif; font-weight: 700; margin-right: 6px;">하은</strong>…뭐라고?</span>
    </div>

  </div>

  <!-- 기입 -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 10px 22px 14px; border-top: 1px solid #1f1c18; position: relative;">
    <div style="height: 44px; padding: 0 11px; border: 1px solid #1f1c18; display: flex; align-items: center; font-size: 11px; letter-spacing: 0.1em;">행동</div>
    <div style="height: 44px; padding: 0 11px; border: 1px solid #b8322a; color: #b8322a; display: flex; align-items: center; font-size: 11px; letter-spacing: 0.1em;">공개</div>
    <div style="flex-grow: 1; height: 44px; border-bottom: 1px solid #9b9280; display: flex; align-items: center; font-size: 12px; color: #6f6656;">진술을 남기십시오</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 2px solid #1f1c18; background: #e6dfd1; position: relative;">
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 13px; letter-spacing: 0.14em; background: #1f1c18; color: #efe9de;">교실</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.14em; color: #4a443a; border-right: 1px solid #b6ad9b; border-left: 1px solid #b6ad9b;">아이들</div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: center; font-family: 'Nanum Myeongjo', serif; font-size: 13px; letter-spacing: 0.14em; color: #4a443a;">프로필</div>
  </div>

</div>
</x-dc>
</body>
</html>
