<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2f6fb3; } a:hover { color: #1f4f85; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #e9edf1; color: #1c2127; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- 방 이름 -->
  <div style="height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #f7f8fa; border-bottom: 1px solid #d5dae0;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c2127" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    <span style="font-weight: 700; font-size: 16px;">우리반</span>
    <span style="font-size: 13px; color: #7a838d;">14</span>
    <span style="flex-grow: 1;"></span>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c2127" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1c2127" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
  </div>

  <!-- 공지 고정 -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #f7f8fa; border-bottom: 1px solid #d5dae0;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7a838d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10"></path><path d="M8 13h8l-1 6H9z"></path><path d="M9 3h6"></path></svg>
    <span style="flex-grow: 1; font-size: 12.5px; color: #3a424b; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;"><strong style="font-weight: 700;">DAY 3 균열</strong> · 오늘: A의 빈자리 · 숨겨왔던 말이나 행동이 일부 공개된다</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7a838d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
  </div>

  <!-- 대화 -->
  <div style="flex-grow: 1; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">

    <div style="align-self: center; font-size: 10.5px; color: #7a838d; background: rgba(28,33,39,0.06); padding: 4px 12px; border-radius: 12px;">2026년 9월 9일 수요일</div>

    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <div style="width: 36px; height: 36px; border-radius: 14px; background: #c9d3dd; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #3a424b; flex-shrink: 0;">서</div>
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 78%;">
        <span style="font-size: 12px; color: #3a424b;">서연</span>
        <div style="display: flex; gap: 6px; align-items: flex-end;">
          <div style="background: #ffffff; padding: 9px 12px; border-radius: 4px 14px 14px 14px; font-size: 14px; line-height: 1.55; color: #1c2127; text-wrap: pretty;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척 하잖아.</div>
          <span style="font-size: 10px; color: #7a838d; white-space: nowrap;">14:02</span>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: flex-end;">
      <div style="display: flex; gap: 6px; align-items: flex-end; max-width: 78%;">
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
          <span style="font-size: 10px; color: #2f6fb3;">3</span>
          <span style="font-size: 10px; color: #7a838d; white-space: nowrap;">14:03</span>
        </div>
        <div style="background: #cfdcea; padding: 9px 12px; border-radius: 14px 4px 14px 14px; font-size: 14px; line-height: 1.55; color: #1c2127; text-wrap: pretty;">그만하자는 사람이 제일 수상한 거, 알지?</div>
      </div>
    </div>

    <!-- 공개 = 시스템 카드 -->
    <div style="align-self: stretch; margin: 4px 6px; background: #ffffff; border-radius: 12px; border-top: 3px solid #c0392b; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(28,33,39,0.08);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 22px; height: 22px; border-radius: 8px; background: #c9d3dd; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: #3a424b;">도</div>
        <span style="font-size: 12px; color: #3a424b;"><strong style="font-weight: 700; color: #1c2127;">도윤</strong>님이 숨겨온 사실을 공개했습니다</span>
      </div>
      <p style="margin: 0; font-size: 14.5px; line-height: 1.65; font-weight: 500; color: #1c2127; text-wrap: pretty;">A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
      <span style="font-size: 10.5px; color: #7a838d;">이 메시지는 삭제할 수 없습니다</span>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-start;">
      <div style="width: 36px; height: 36px; border-radius: 14px; background: #c9d3dd; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #3a424b; flex-shrink: 0;">하</div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; color: #3a424b;">하은</span>
        <div style="display: flex; gap: 6px; align-items: flex-end;">
          <div style="background: #ffffff; padding: 9px 12px; border-radius: 4px 14px 14px 14px; font-size: 14px; line-height: 1.55; color: #1c2127;">…뭐라고?</div>
          <span style="font-size: 10px; color: #7a838d;">14:05</span>
        </div>
      </div>
    </div>

  </div>

  <!-- 입력 -->
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px 10px; background: #f7f8fa; border-top: 1px solid #d5dae0;">
    <div style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: #3a424b; background: #e3e8ee;">행동</div>
    <div style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #ffffff; background: #c0392b;">공개</div>
    <div style="flex-grow: 1; height: 40px; border-radius: 20px; background: #ffffff; border: 1px solid #d5dae0; display: flex; align-items: center; padding: 0 14px; font-size: 13.5px; color: #98a0a8;">메시지 입력</div>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7a838d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"></path><path d="M13 5l7 7-7 7"></path></svg>
  </div>

  <!-- 탭 -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #f7f8fa; border-top: 1px solid #d5dae0;">
    <div style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1c2127;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10H9l-5 4z"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500;">교실</span>
    </div>
    <div style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #98a0a8;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><circle cx="17" cy="9" r="2.6"></circle><path d="M3 19c1-3.5 3.5-5 6-5s5 1.5 6 5"></path><path d="M15 15c2.2 0 4.2 1.2 5 3.5"></path></svg>
      <span style="font-size: 10.5px;">아이들</span>
    </div>
    <div style="height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #98a0a8;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3.5"></circle><path d="M5 20c1.2-3.5 3.8-5 7-5s5.8 1.5 7 5"></path></svg>
      <span style="font-size: 10.5px;">프로필</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
