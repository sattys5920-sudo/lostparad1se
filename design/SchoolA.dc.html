<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1d4ed8; } a:hover { color: #1e3a8a; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f3f4f6; color: #111827; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <!-- 포털 헤더 -->
  <div style="height: 52px; flex-shrink: 0; background: #1e3a8a; display: flex; align-items: center; gap: 10px; padding: 0 16px;">
    <div style="width: 22px; height: 22px; border: 1.5px solid #dbe4f3; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: #dbe4f3;">校</div>
    <span style="color: #ffffff; font-size: 14px; font-weight: 700; letter-spacing: 0.02em;">학급정보시스템</span>
  </div>

  <!-- 경로 -->
  <div style="flex-shrink: 0; height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 16px; background: #e5e7eb; font-size: 10.5px; color: #4b5563;">
    <span>홈</span><span>›</span><span>학급관리</span><span>›</span><span style="color: #1e3a8a; font-weight: 500;">우리반 게시판</span>
  </div>

  <!-- 공지 배너 -->
  <div style="flex-shrink: 0; margin: 10px 14px 0; background: #eef2ff; border: 1px solid #c7d2fe; padding: 9px 12px; display: flex; align-items: center; gap: 8px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><circle cx="12" cy="16" r="0.5" fill="#1e3a8a"></circle></svg>
    <span style="font-size: 11px; color: #1e3a8a; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;"><strong>DAY 3 균열</strong> · 금일 안건: A의 빈자리</span>
  </div>

  <!-- 게시글 목록형 대화 -->
  <div style="flex-grow: 1; margin-top: 10px; padding: 0 14px 8px; display: flex; flex-direction: column; gap: 0; overflow: hidden;">

    <div style="display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid #e5e7eb;">
      <div style="width: 30px; height: 30px; background: #dbe4f3; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #1e3a8a;">서</div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="display: flex; gap: 8px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 700;">서연</span>
          <span style="font-size: 10px; color: #6b7280;">2026-09-09 14:02</span>
        </div>
        <span style="font-size: 13px; line-height: 1.6; color: #374151;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</span>
      </div>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid #e5e7eb;">
      <div style="width: 30px; height: 30px; background: #1e3a8a; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #ffffff;">나</div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
        <div style="display: flex; gap: 8px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 700;">나</span>
          <span style="font-size: 10px; color: #6b7280;">2026-09-09 14:03</span>
        </div>
        <span style="font-size: 13px; line-height: 1.6; color: #374151;">그만하자는 사람이 제일 수상한 거, 알지?</span>
      </div>
    </div>

    <!-- 공개 = 시스템 공문 박스 -->
    <div style="margin: 10px 0; background: #ffffff; border: 1px solid #93a5cc; border-left: 4px solid #1e3a8a;">
      <div style="padding: 9px 12px; background: #eef2ff; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 10.5px; font-weight: 700; color: #1e3a8a; letter-spacing: 0.04em;">공개 알림 · 접수번호 0309-14</span>
        <span style="font-size: 9.5px; color: #4b5563;">2026-09-09 14:04</span>
      </div>
      <div style="padding: 12px;">
        <span style="font-size: 10.5px; color: #6b7280;">공개자</span>
        <span style="font-size: 12px; font-weight: 700; margin-left: 6px;">도윤</span>
        <p style="margin: 8px 0 0; font-size: 13.5px; line-height: 1.7; color: #111827; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
      </div>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid #e5e7eb;">
      <div style="width: 30px; height: 30px; background: #dbe4f3; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #1e3a8a;">하</div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="display: flex; gap: 8px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 700;">하은</span>
          <span style="font-size: 10px; color: #6b7280;">2026-09-09 14:05</span>
        </div>
        <span style="font-size: 13px; line-height: 1.6; color: #374151;">…뭐라고?</span>
      </div>
    </div>

  </div>

  <!-- 작성 영역 -->
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid #d1d5db; background: #ffffff;">
    <div style="height: 44px; padding: 0 13px; border: 1px solid #9ca3af; display: flex; align-items: center; font-size: 11.5px; color: #374151;">행동</div>
    <div style="height: 44px; padding: 0 13px; background: #1e3a8a; display: flex; align-items: center; font-size: 11.5px; color: #ffffff; font-weight: 500;">공개</div>
    <div style="flex-grow: 1; height: 44px; border: 1px solid #d1d5db; background: #f9fafb; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #6b7280;">내용을 입력하세요</div>
  </div>

  <!-- 탭 -->
  <div style="flex-shrink: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #d1d5db; background: #ffffff;">
    <div style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #1e3a8a; border-top: 2px solid #1e3a8a; margin-top: -1px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="1"></rect><path d="M3 9h18"></path></svg>
      <span style="font-size: 10px; font-weight: 500;">게시판</span>
    </div>
    <div style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9ca3af;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"></rect><path d="M3 9h18"></path><path d="M8 4v5"></path></svg>
      <span style="font-size: 10px;">명부</span>
    </div>
    <div style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9ca3af;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"></rect><path d="M8 8h8"></path><path d="M8 12h8"></path><path d="M8 16h5"></path></svg>
      <span style="font-size: 10px;">신상카드</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
