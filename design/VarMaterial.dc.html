<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gothic+A1:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #2b3136; } a:hover { color: #55606a; }
  </style>
</helmet>

<!-- 광원: 좌상단. 모든 그림자는 우하단으로 -->
<div style="width: 390px; height: 844px; color: #1f2327; font-family: 'Gothic A1', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative; background-color: #8d9298; background-image: radial-gradient(140% 90% at 8% 0%, rgba(255,255,255,0.28), rgba(255,255,255,0) 55%), radial-gradient(90% 70% at 100% 100%, rgba(0,0,0,0.28), rgba(0,0,0,0) 60%), repeating-linear-gradient(0deg, rgba(0,0,0,0.045) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 5px);">

  <!-- 콘크리트 벽에 붙은 명패 -->
  <div style="flex-shrink: 0; margin: 16px 18px 0; padding: 10px 14px; background: linear-gradient(180deg, #dcd7cc, #c9c3b6); box-shadow: 3px 4px 8px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.6); display: flex; align-items: baseline; gap: 10px;">
    <span style="font-size: 15px; font-weight: 700; letter-spacing: 0.06em;">우리 반 게시판</span>
    <span style="font-size: 10.5px; color: #4a463f;">DAY 3 · 균열</span>
  </div>

  <!-- 원글: 테이프로 붙인 종이 -->
  <div style="flex-shrink: 0; margin: 14px 18px 0; position: relative; background: linear-gradient(170deg, #f4f1ea, #e6e2d8); padding: 14px 16px 12px; box-shadow: 4px 5px 10px rgba(0,0,0,0.38); transform: rotate(-0.6deg);">
    <div style="position: absolute; top: -7px; left: 22px; width: 52px; height: 16px; background: rgba(230,226,214,0.75); transform: rotate(-3deg); box-shadow: 1px 2px 2px rgba(0,0,0,0.2);"></div>
    <div style="position: absolute; top: -6px; right: 26px; width: 48px; height: 16px; background: rgba(230,226,214,0.75); transform: rotate(4deg); box-shadow: 1px 2px 2px rgba(0,0,0,0.2);"></div>
    <span style="font-size: 10px; letter-spacing: 0.14em; color: #6b675f;">공지</span>
    <p style="margin: 4px 0 0; font-family: 'Nanum Pen Script', cursive; font-size: 24px; line-height: 1.15; color: #1f2327;">오늘: A의 빈자리</p>
    <p style="margin: 6px 0 0; font-size: 12px; color: #4a4741; line-height: 1.6;">기존 관계가 흔들리기 시작한다. 숨겨왔던 말이나 행동이 일부 공개된다.</p>
    <div style="display: flex; gap: 14px; margin-top: 8px; font-size: 11px; color: #6b675f;"><span>댓글 4</span><span>공감 2</span></div>
  </div>

  <!-- 댓글: 쪽지들 -->
  <div style="flex-grow: 1; padding: 14px 18px 4px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">

    <div style="position: relative; background: #efece4; padding: 10px 13px; box-shadow: 3px 4px 8px rgba(0,0,0,0.35); transform: rotate(0.5deg); max-width: 88%;">
      <div style="display: flex; gap: 7px; align-items: baseline;">
        <span style="font-size: 12px; font-weight: 700;">서연</span><span style="font-size: 10.5px; color: #6b675f;">3분 전</span>
      </div>
      <p style="margin: 3px 0 0; font-family: 'Nanum Pen Script', cursive; font-size: 19px; line-height: 1.3; color: #1f2327;">A 얘기 좀 그만하면 안 돼? 다들 아무렇지 않은 척하잖아.</p>
    </div>

    <div style="position: relative; align-self: flex-end; background: #dfe3e8; padding: 10px 13px; box-shadow: 3px 4px 8px rgba(0,0,0,0.35); transform: rotate(-0.8deg); max-width: 88%;">
      <div style="display: flex; gap: 7px; align-items: baseline;">
        <span style="font-size: 12px; font-weight: 700; color: #2b3136;">나</span><span style="font-size: 10.5px; color: #6b675f;">2분 전</span>
      </div>
      <p style="margin: 3px 0 0; font-family: 'Nanum Pen Script', cursive; font-size: 19px; line-height: 1.3; color: #1f2327;">그만하자는 사람이 제일 수상한 거, 알지?</p>
    </div>

    <!-- 공개 = 압정으로 박아 둔 종이. 뗄 수 없다 -->
    <div style="position: relative; margin: 6px 0 2px; background: linear-gradient(175deg, #f7f4ed, #e9e5db); padding: 16px 16px 12px; box-shadow: 5px 7px 14px rgba(0,0,0,0.45); border: 1px solid rgba(0,0,0,0.08);">
      <div style="position: absolute; top: -8px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7b1e1e, #3c0c0c); box-shadow: 2px 3px 4px rgba(0,0,0,0.5);"></div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 10px; letter-spacing: 0.16em; padding: 2px 7px; border: 1px solid #1f2327; color: #1f2327;">공개</span>
        <span style="font-size: 12px; font-weight: 700;">도윤</span>
        <span style="font-size: 10.5px; color: #6b675f;">방금</span>
      </div>
      <p style="margin: 8px 0 0; font-family: 'Nanum Pen Script', cursive; font-size: 21px; line-height: 1.3; color: #1f2327; text-wrap: pretty;">사실 A가 마지막으로 도움을 요청했을 때, 귀찮다는 이유로 거절했다.</p>
      <span style="display: block; margin-top: 6px; font-size: 10.5px; color: #6b675f;">압정으로 박혀 있다</span>
    </div>

    <div style="position: relative; background: #efece4; padding: 10px 13px; box-shadow: 3px 4px 8px rgba(0,0,0,0.35); transform: rotate(0.4deg); max-width: 60%;">
      <div style="display: flex; gap: 7px; align-items: baseline;">
        <span style="font-size: 12px; font-weight: 700;">하은</span><span style="font-size: 10.5px; color: #6b675f;">방금</span>
      </div>
      <p style="margin: 3px 0 0; font-family: 'Nanum Pen Script', cursive; font-size: 19px; line-height: 1.3; color: #1f2327;">…뭐라고?</p>
    </div>

  </div>

  <!-- 입력: 금속 트레이 -->
  <div style="flex-shrink: 0; margin: 6px 18px 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: linear-gradient(180deg, #b9bec4, #9aa0a6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 3px 4px 8px rgba(0,0,0,0.35);">
    <div style="height: 44px; padding: 0 12px; background: linear-gradient(180deg, #e9e6df, #d3cfc5); box-shadow: 2px 2px 4px rgba(0,0,0,0.3); display: flex; align-items: center; font-size: 11.5px; font-weight: 500;">행동</div>
    <div style="height: 44px; padding: 0 12px; background: linear-gradient(180deg, #3a3f45, #1f2327); color: #eef0f2; box-shadow: 2px 2px 4px rgba(0,0,0,0.4); display: flex; align-items: center; font-size: 11.5px; font-weight: 500;">공개</div>
    <div style="flex-grow: 1; height: 44px; background: #eceae4; box-shadow: inset 2px 2px 4px rgba(0,0,0,0.25); display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #5a5650;">쪽지를 쓴다</div>
  </div>

  <!-- 탭: 나무 팻말 -->
  <div style="flex-shrink: 0; margin: 10px 18px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <div style="height: 50px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #f1ede4; background: linear-gradient(180deg, #4a3b2e, #2f251c); box-shadow: 3px 4px 8px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.15);">게시판</div>
    <div style="height: 50px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #1f1710; background: linear-gradient(180deg, #a68a6b, #8a6f52); box-shadow: 3px 4px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);">아이들</div>
    <div style="height: 50px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; color: #1f1710; background: linear-gradient(180deg, #a68a6b, #8a6f52); box-shadow: 3px 4px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.25);">프로필</div>
  </div>

</div>
</x-dc>
</body>
</html>
