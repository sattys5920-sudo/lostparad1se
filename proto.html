<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0b0d0f" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>남겨진 아이들 · 걸어 다니는 학교 (프로토타입)</title>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div id="gate">
      <h1>걸어 다니는 학교</h1>
      <p>
        방향키나 WASD, 화면 아래 방향 패드로 움직인다. 같은 방에 있는 사람끼리만 대화가 오간다 —
        둘이서만 이야기하고 싶으면 아무도 없는 곳으로 가야 한다.
      </p>
      <div id="offline" hidden>Firebase가 연결되지 않아 혼자만 보인다.</div>
      <input id="nick" maxlength="8" placeholder="이름" />
      <button id="enter">들어가기</button>
    </div>

    <div id="hud" hidden>
      <div class="topbar">
        <span id="room">복도</span>
        <span id="here"></span>
      </div>
      <div class="hint">Enter로 말하기</div>
      <div id="log"></div>
      <div id="pad">
        <button class="up" data-dir="up" aria-label="위">▲</button>
        <button class="left" data-dir="left" aria-label="왼쪽">◀</button>
        <button class="right" data-dir="right" aria-label="오른쪽">▶</button>
        <button class="down" data-dir="down" aria-label="아래">▼</button>
      </div>
      <div class="chatbar">
        <input id="chat" maxlength="80" placeholder="같은 방 사람에게 말하기" />
      </div>
    </div>

    <script type="module" src="/src/proto/main.ts"></script>
  </body>
</html>
