name: Deploy site

# 화면을 Firebase Hosting 에 올린다 — https://<프로젝트>.web.app/
#
# 예전에는 GitHub Pages(https://<계정>.github.io/lostparad1se/)에 올렸다. 그
# 주소에는 계정 이름이 박혀서 옮겼다. 옛 주소로 들어온 사람은 새 주소로
# 넘긴다 — Pages 에는 넘기는 한 장만 올린다(아래 redirect 잡).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 저장소 시크릿은 Firebase 콘솔의 config 키 이름(apiKey, projectId ...)을 그대로 대문자로
# 쓴 형태로 등록돼 있다. 앱이 읽는 이름은 VITE_ 접두어가 붙은 쪽이라 여기서 이어 준다.
env:
  VITE_FIREBASE_API_KEY: ${{ secrets.APIKEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.AUTHDOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.PROJECTID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.STORAGEBUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.MESSAGINGSENDERID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.APPID }}

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # 값이 비어 있으면 빌드는 그대로 성공하고 배포된 화면에서만 "Firebase가 연결되지
      # 않았다"로 나타나 원인을 찾기 어렵다. 어떤 항목이 비었는지만 남긴다(값은 찍지 않는다).
      - name: Check firebase secrets are present
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                      VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID SA; do
            if [ -n "${!name}" ]; then
              echo "$name: 설정됨"
            else
              echo "$name: 비어 있음"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::시크릿 $missing 개가 비어 있다. 저장소 Settings → Secrets and variables → Actions 의 Repository secrets 를 확인해야 한다."
            exit 1
          fi
      - run: npm test
      - run: npm run build
      # 서버 전용 문장이 번들에 섞이면 개발자도구 하나로 닷새치 진상이
      # 첫날 아침에 읽힌다. 되돌릴 수 없으므로 배포 전에 막는다.
      - name: Check server-only story text did not leak into the bundle
        run: npm run check:bundle
      - name: Deploy to Firebase Hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.PROJECTID }}
        run: |
          # 열쇠는 파일로 건넨다. 명령줄에 두면 실패한 명령이 로그에 통째로 찍힐 수 있다
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          npx -y firebase-tools@13 deploy --only hosting --project "$PROJECT" --non-interactive
          echo "올렸다: https://$PROJECT.web.app/"

  # 옛 주소(GitHub Pages)로 들어온 사람을 새 주소로 넘긴다. ?game= 같은 꼬리는 그대로 단다
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write the forwarding page
        env:
          PROJECT: ${{ secrets.PROJECTID }}
        run: |
          mkdir -p out
          cat > out/index.html <<HTML
          <!doctype html>
          <html lang="ko">
            <head>
              <meta charset="UTF-8" />
              <meta name="robots" content="noindex" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>투명인간</title>
              <script>
                // 옛 주소의 어느 쪽으로 왔든 새 주소의 같은 자리로. 꼬리(?game=)는 그대로
                var rest = location.pathname.replace(/^\/lostparad1se\/?/, '')
                location.replace('https://${PROJECT}.web.app/' + rest + location.search + location.hash)
              </script>
            </head>
            <body style="background:#0c0e12;color:#ddd;font-family:sans-serif;padding:24px">
              <p>주소가 바뀌었다. <a style="color:#e8c877" href="https://${PROJECT}.web.app/">https://${PROJECT}.web.app/</a></p>
            </body>
          </html>
          HTML
          cp out/index.html out/404.html
          cp out/index.html out/play.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
