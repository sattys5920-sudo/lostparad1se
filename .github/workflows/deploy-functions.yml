# 서버(Cloud Functions)와 Firestore 규칙을 올린다.
#
# **main 에 서버 쪽이 바뀌면 저절로 돈다.** 화면(deploy.yml)과 같다.
# 손으로도 돌릴 수 있게 workflow_dispatch 는 남겨 둔다 — 코드는 그대로
# 두고 다시 올리고 싶을 때가 있다.
#
# paths 로 서버와 상관있는 것만 고른다. 화면만 고친 push 마다 서버를
# 갈아끼우면, 바뀐 것이 없는데도 몇 분씩 걸리고 그때마다 함수가 한 번씩
# 식는다(첫 호출이 느려진다).
#
# **판이 도는 중에 올라갈 수 있다는 뜻이기도 하다.** 배포 중 몇 초는
# 함수가 예전 것과 새것 사이에 있다. 날짜를 건너뛰는 규칙 변경처럼
# 판을 깨뜨릴 만한 것을 올릴 때는, main 에 넣기 전에 판이 도는지
# 먼저 보는 것이 맞다.
#
# 규칙도 여기서 같이 올린다. 콘솔에 손으로 붙여넣던 것을 그만두는
# 것이다 — 저장소의 firestore.rules 가 유일한 정본이 된다.
#
# **색인(firestore.indexes.json)도 여기서 올린다.** 한동안 안 올렸다 —
# 파일 자체가 없었다. 에뮬레이터는 색인 없이도 어떤 쿼리든 돌려서
# 검증이 전부 통과했는데, 실제 Firestore 는 「같음 + 범위」 복합 쿼리를
# 색인 없이는 거절한다. chatLines·radioLines 가 그렇게 영영 실패했고,
# 화면은 그 오류를 삼켜서 로그도 풍선도 그냥 비어 있었다.
#
# 필요한 시크릿 둘 (Settings → Secrets and variables → Actions)
#   PROJECTID                  이미 등록돼 있다. 화면 빌드가 쓰던 것
#   FIREBASE_SERVICE_ACCOUNT   서비스 계정 열쇠(JSON) 통째로
name: Deploy functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      what:
        description: 무엇을 올릴까
        required: true
        default: functions,firestore:rules,firestore:indexes
        type: choice
        options:
          - functions,firestore:rules,firestore:indexes
          - functions
          - firestore:rules
          - firestore:indexes

permissions:
  contents: read

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 값은 찍지 않는다. 무엇이 비었는지만 남긴다
      - name: Check the deploy key is present
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.PROJECTID }}
        run: |
          missing=0
          [ -n "$PROJECT" ] && echo "PROJECTID: 설정됨" || { echo "PROJECTID: 비어 있음"; missing=1; }
          [ -n "$SA" ] && echo "FIREBASE_SERVICE_ACCOUNT: 설정됨" || { echo "FIREBASE_SERVICE_ACCOUNT: 비어 있음"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::시크릿이 비어 있다. Settings → Secrets and variables → Actions 를 확인해야 한다."
            exit 1
          fi

      - run: npm ci --prefix functions

      # 올리기 전에 서버 코드가 컴파일되는지 본다. firebase.json 의 predeploy
      # 훅도 같은 것을 돌리지만, 거기서 깨지면 절반 올라간 상태가 될 수 있다
      - name: Build functions
        run: npm --prefix functions run build

      # 운영자 코드. 저장소에는 없다 — 여기 적으면 깃허브를 보는 누구나
      # 운영자가 된다. 배포할 때만 functions/.env 로 만들어 실어 보낸다
      # (firebase CLI 가 이 파일을 함수 환경변수로 올린다). .env 는
      # .gitignore 에 있어서 실수로 커밋될 일도 없다.
      - name: Put the host code in the functions environment
        env:
          HOST_CODE: ${{ secrets.HOST_CODE }}
        run: |
          if [ -z "$HOST_CODE" ]; then
            echo "::warning::HOST_CODE 시크릿이 없다. 운영자 코드 입력이 동작하지 않는다."
          else
            printf 'HOST_CODE=%s\n' "$HOST_CODE" > functions/.env
            echo "운영자 코드: 실었다"
          fi

      - name: Deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.PROJECTID }}
          # push 로 돌 때는 inputs 가 비어 있다. 비운 채로 --only 에 넘기면
          # 아무것도 안 올라가거나 전부 올라간다 — 둘 다 조용히 잘못된다
          WHAT: ${{ inputs.what || 'functions,firestore:rules,firestore:indexes' }}
        run: |
          # 열쇠를 명령줄이 아니라 파일로 건넨다. 명령줄에 두면 따옴표
          # 하나에 깨지고, 실패한 명령이 로그에 통째로 찍힐 수 있다
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          npx -y firebase-tools@13 deploy \
            --only "$WHAT" \
            --project "$PROJECT" \
            --non-interactive \
            --force
