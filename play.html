         이 페이지가 아니라 어느 판이냐를 고르는 말이라(?game=), 그대로

         replace 다. push 로 넘기면 뒤로 가기가 여기로 돌아오고, 여기는

    <title>남겨진 아이들</title>
    <script>
      location.replace('./' + location.search + location.hash)
    </script>

  </body>
